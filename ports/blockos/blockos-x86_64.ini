[binaries]
c = 'x86_64-unknown-blockos-gcc'
cpp = 'x86_64-unknown-blockos-g++'
ar = 'x86_64-unknown-blockos-ar'
strip = 'x86_64-unknown-blockos-strip'
ranlib = 'x86_64-unknown-blockos-ranlib'
pkgconfig = 'pkg-config'

[built-in options]
c_std = 'c11'
cpp_std = 'c++17'
b_lto = true

[host_machine]
system = 'blockos'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '/opt/blockos/sysroot'
