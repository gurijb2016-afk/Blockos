[binaries]
c = 'x86_64-blockos-gcc'
cpp = 'x86_64-blockos-g++'
ar = 'x86_64-blockos-ar'
strip = 'x86_64-blockos-strip'
pkg-config = 'pkg-config'
python = 'python3'

[host_machine]
system = 'blockos'
kernel = 'blockos'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '/'
has_function_printf = true
needs_exe_wrapper = true

[built-in options]
c_args = ['-O2', '-fPIC', '-fno-exceptions', '-fno-rtti']
cpp_args = ['-O2', '-fPIC', '-fno-exceptions', '-fno-rtti']

[paths]
prefix = '/system'
libdir = 'lib'
bindir = 'bin'
datadir = 'share'
sysconfdir = 'etc'
localedir = 'share/locale'
