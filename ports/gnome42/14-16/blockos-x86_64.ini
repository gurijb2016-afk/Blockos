[binaries]
c = 'x86_64-pc-blockos-gcc'
cpp = 'x86_64-pc-blockos-g++'
ar = 'x86_64-pc-blockos-ar'
strip = 'x86_64-pc-blockos-strip'
ld = 'x86_64-pc-blockos-ld'

[properties]
sys_root = '/System'
root = '/System'

[host_machine]
system = 'blockos'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
b_lto = false
buildtype = 'release'
warning_level = 1

[project options]
