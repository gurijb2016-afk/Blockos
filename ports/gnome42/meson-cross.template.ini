[binaries]
c = ['__CC__']
cpp = ['__CXX__']
ar = ['__AR__']
strip = ['__STRIP__']
pkgconfig = ['__PKG_CONFIG__']

[host_machine]
system = 'blockos'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '__SYSROOT__'
needs_exe_wrapper = true

[built-in options]
c_args = ['-ffreestanding', '-fno-stack-protector', '-fno-exceptions', '-fno-rtti', '-fPIC', '-mno-red-zone']
cpp_args = ['-ffreestanding', '-fno-stack-protector', '-fno-exceptions', '-fno-rtti', '-fPIC', '-mno-red-zone']
